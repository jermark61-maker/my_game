name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev

    - name: Upgrade Pip & Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer
        pip install cython==0.29.36

    - name: Accept Licenses and Install Required Build Tools
      run: |
        mkdir -p ~/.android
        echo "### License accepted by GitHub Actions" > ~/.android/repositories.cfg
        # Tanggapin ang lahat ng lisensya at i-install nang patiuna ang build-tools 33.0.2 at platform-tools para hindi na mag-prompt
        echo "y" | sdkmanager "platforms;android-33" "build-tools;33.0.2" "platforms;android-31" "build-tools;31.0.0" || true
        yes | sdkmanager --licenses || true

    - name: Run Buildozer Build
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
